name: 'fini'
description: 'Run fini file normalization tool'
author: 'tsukasaI'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  version:
    description: 'Version of fini to use (default: latest)'
    required: false
    default: 'latest'
  files:
    description: 'Files or directories to check'
    required: false
    default: '.'
  check:
    description: 'Run in check mode (fail if issues found)'
    required: false
    default: 'true'
  verify-attestation:
    description: |
      Verify SLSA build provenance via `gh attestation verify` (requires gh CLI and a GITHUB_TOKEN).
      Defaults to 'true': the default version input ('latest') always resolves to a release with
      an attestation, and a security control should default to fail-closed rather than require an
      explicit opt-in. Set this to 'false' only if you pin `version` to a release before v0.4.0,
      which predates attestations - a soft-fail there would let a tampered artifact pass simply by
      omitting its attestation, so this is a deliberate, documented opt-out, not a new default.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Determine version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "$INPUT_VERSION" = "latest" ]; then
          # Authenticated: the unauthenticated api.github.com rate limit
          # (60 req/hour per source IP, shared by every job on the runner
          # pool) made this intermittently fail on busy runners; the
          # workflow's own GITHUB_TOKEN raises that to 1000/hour (issue #97).
          VERSION=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/tsukasaI/fini/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to resolve latest fini version" >&2
            exit 1
          fi
        else
          # Reject anything that isn't a plausible version tag to keep this value
          # safe to use in URLs and filenames downstream.
          case "$INPUT_VERSION" in
            v[0-9]*|[0-9]*) VERSION="$INPUT_VERSION" ;;
            *)
              echo "::error::Invalid version '$INPUT_VERSION' (expected vX.Y.Z or X.Y.Z)" >&2
              exit 1 ;;
          esac
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Download and verify fini
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        case "$OS-$ARCH" in
          darwin-arm64)  TARGET="aarch64-apple-darwin" ;;
          darwin-x86_64) TARGET="x86_64-apple-darwin" ;;
          linux-aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
          linux-x86_64)  TARGET="x86_64-unknown-linux-gnu" ;;
          *)
            echo "::error::Unsupported platform: $OS-$ARCH" >&2
            exit 1 ;;
        esac

        TARBALL="fini-${TARGET}.tar.gz"
        BASE="https://github.com/tsukasaI/fini/releases/download/${VERSION}"

        # Install outside the consumer's checkout: extracting into the
        # default working directory ($GITHUB_WORKSPACE, the caller's repo)
        # would leave the fini binary sitting in their tree (visible to
        # git status, other steps, and fini's own future scans of that
        # repo), and adding that whole directory to PATH would let any
        # same-named file already in the repo root shadow a real command
        # for the rest of the job (issue #96).
        INSTALL_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/fini-install.XXXXXX")"
        cd "$INSTALL_DIR"

        # Download tarball and checksums (separate steps so we can verify before extracting).
        curl -fsSL --retry 3 -o "$TARBALL"     "${BASE}/${TARBALL}"
        curl -fsSL --retry 3 -o checksums.txt  "${BASE}/checksums.txt"

        # Verify SHA-256. The release workflow records checksums as `<sha>  <dir>/<name>`,
        # so strip any leading path component before matching against our local file.
        EXPECTED=$(awk -v name="$TARBALL" '{
          n = $NF; sub(".*/", "", n);
          if (n == name) { print $1; exit }
        }' checksums.txt)
        if [ -z "$EXPECTED" ]; then
          echo "::error::No checksum entry for $TARBALL in checksums.txt" >&2
          exit 1
        fi
        ACTUAL=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::Checksum mismatch for $TARBALL (expected $EXPECTED, got $ACTUAL)" >&2
          exit 1
        fi
        echo "Checksum verified: $TARBALL ($ACTUAL)"

        # Verify SLSA build provenance. Hard-fail when enabled so a missing attestation
        # cannot be silently accepted (which would let an attacker bypass verification by
        # simply omitting the provenance from a forged release).
        if [ "$VERIFY_ATTESTATION" = "true" ]; then
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::verify-attestation=true but the gh CLI is not installed on this runner" >&2
            exit 1
          fi
          if ! gh attestation verify "$TARBALL" --repo tsukasaI/fini; then
            echo "::error::Build provenance verification failed for $TARBALL (version $VERSION). Releases before v0.4.0 have no attestation: bump 'version' to v0.4.0 or later, or set verify-attestation: 'false' to opt out." >&2
            exit 1
          fi
          echo "Build provenance verified for $TARBALL"
        fi

        tar xzf "$TARBALL"
        chmod +x fini
        rm -f "$TARBALL" checksums.txt
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Run fini
      shell: bash
      env:
        FINI_CHECK: ${{ inputs.check }}
        FINI_FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        # Split FINI_FILES on whitespace into an array so callers can still pass multiple
        # paths (e.g. "src/ tests/") without exposing the value to shell metacharacter
        # interpretation. `read -ra` performs pure word-splitting — no command/parameter
        # or pathname expansion happens because each element is passed quoted below.
        FILES_ARR=()
        if [ -n "$FINI_FILES" ]; then
          read -ra FILES_ARR <<<"$FINI_FILES"
        fi
        if [ "$FINI_CHECK" = "true" ]; then
          fini --check "${FILES_ARR[@]}"
        else
          fini "${FILES_ARR[@]}"
        fi
