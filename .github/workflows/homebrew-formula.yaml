name: Homebrew formula

# Regenerates HomebrewFormula/fini.rb for a released tag and opens a pull
# request. Called by the release workflow, and runnable by hand for a tag
# whose release already exists (issue #260).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to regenerate the formula for (vX.Y.Z)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the formula branch
      pull-requests: write  # open the formula PR
    env:
      # Read from the environment in every step below, never interpolated
      # into a script: on workflow_dispatch the tag is typed by a person.
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          # Stable tags only: the formula never points at a pre-release, also
          # when this workflow is started by hand.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG does not match expected format vX.Y.Z (pre-releases do not update the formula)" >&2
            exit 1
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'fini-*.tar.gz' --pattern 'checksums.txt' \
            --dir /tmp/release-assets

      # The script verifies the download against checksums.txt (fail closed)
      # before hashing anything into the formula.
      - name: Regenerate formula
        run: bash scripts/update-homebrew-formula.sh "${TAG#v}" /tmp/release-assets

      # Not a push to main: the main ruleset requires a pull request and has no
      # bypass.
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet HomebrewFormula/fini.rb; then
            echo "Formula already up to date; nothing to commit"
            exit 0
          fi
          branch="chore/homebrew-formula-${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add HomebrewFormula/fini.rb
          git commit -m "chore(homebrew): update formula to ${TAG#v}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(homebrew): update formula to ${TAG#v}" \
            --body "Regenerated by the Homebrew formula workflow for ${TAG}."
