name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag is only released from main, and only if the tests pass on it:
  # pushing a tag does not run CI by itself (issue #262).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          # main takes squash merges, so a tag put on a branch commit before
          # the merge names a commit main never contains.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag the merged commit on main" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04

      - name: Run tests
        run: cargo test --locked

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Not ubuntu-latest: the binary links against the runner's glibc,
          # so a newer image raises the minimum glibc users need.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04
        with:
          targets: ${{ matrix.target }}

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fini") | .version')"
          if [ -z "$CARGO_VERSION" ] || [ "$CARGO_VERSION" = "null" ]; then
            echo "::error::Could not read package version from cargo metadata" >&2
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../fini-${{ matrix.target }}.tar.gz fini
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fini-${{ matrix.target }}
          path: fini-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # mint OIDC token for build provenance
      attestations: write   # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # -mindepth/-maxdepth 2 narrows the scope to where upload-artifact places
          # one tarball per matrix entry (artifacts/<name>/<file>); rejects any rogue
          # .tar.gz planted at other depths.
          find artifacts -mindepth 2 -maxdepth 2 -name 'fini-*.tar.gz' -exec mv {} dist/ \;
          ls -la dist/

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum fini-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/fini-*.tar.gz'

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/fini-*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          # A tag like v1.0.0-rc.1 is a pre-release: it must not become the
          # "latest" release the GitHub Action resolves by default.
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-homebrew-formula:
    needs: release
    # The formula follows stable releases only.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write       # push the formula branch
      pull-requests: write  # open the formula PR
    uses: ./.github/workflows/homebrew-formula.yaml
    with:
      tag: ${{ github.ref_name }}
