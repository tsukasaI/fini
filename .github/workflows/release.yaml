name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04
        with:
          targets: ${{ matrix.target }}

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fini") | .version')"
          if [ -z "$CARGO_VERSION" ] || [ "$CARGO_VERSION" = "null" ]; then
            echo "::error::Could not read package version from cargo metadata" >&2
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../fini-${{ matrix.target }}.tar.gz fini
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fini-${{ matrix.target }}
          path: fini-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # mint OIDC token for build provenance
      attestations: write   # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # -mindepth/-maxdepth 2 narrows the scope to where upload-artifact places
          # one tarball per matrix entry (artifacts/<name>/<file>); rejects any rogue
          # .tar.gz planted at other depths.
          find artifacts -mindepth 2 -maxdepth 2 -name 'fini-*.tar.gz' -exec mv {} dist/ \;
          ls -la dist/

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum fini-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/fini-*.tar.gz'

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/fini-*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  update-homebrew-formula:
    # The primary control is this job's own "Validate tag format" step below.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the regenerated formula back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match expected format vX.Y.Z[-prerelease]" >&2
            exit 1
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'fini-*.tar.gz' --pattern 'checksums.txt' \
            --dir /tmp/release-assets

      # The script verifies the download against checksums.txt (fail closed)
      # before hashing anything into the formula.
      - name: Regenerate formula
        run: bash scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME#v}" /tmp/release-assets

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet HomebrewFormula/fini.rb; then
            echo "Formula already up to date; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HomebrewFormula/fini.rb
          git commit -m "chore(homebrew): update formula to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
