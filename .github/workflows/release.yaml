name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../fini-${{ matrix.target }}.tar.gz fini
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fini-${{ matrix.target }}
          path: fini-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # mint OIDC token for build provenance
      attestations: write   # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # -mindepth/-maxdepth 2 narrows the scope to where upload-artifact places
          # one tarball per matrix entry (artifacts/<name>/<file>); rejects any rogue
          # .tar.gz planted at other depths.
          find artifacts -mindepth 2 -maxdepth 2 -name 'fini-*.tar.gz' -exec mv {} dist/ \;
          ls -la dist/

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum fini-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/fini-*.tar.gz'

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/fini-*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  update-homebrew-formula:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the regenerated formula back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'fini-*.tar.gz' --pattern 'checksums.txt' \
            --dir /tmp/release-assets

      # The script verifies the download against checksums.txt (fail closed)
      # before hashing anything into the formula.
      - name: Regenerate formula
        run: bash scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME#v}" /tmp/release-assets

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet HomebrewFormula/fini.rb; then
            echo "Formula already up to date; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HomebrewFormula/fini.rb
          git commit -m "chore(homebrew): update formula to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout only
      id-token: write       # mint OIDC token for build provenance
      attestations: write   # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04

      # No rust-cache here: --no-verify skips the build, so the cache buys nothing
      # and a poisoned cache entry could substitute dependencies at publish time.

      - name: Verify version and resolve crate path
        id: prepare
        run: |
          set -euo pipefail
          # Strips the leading "v"; works for pre-release tags too
          # (e.g. v0.4.0-rc1 -> 0.4.0-rc1, matched against Cargo.toml verbatim).
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fini") | .version')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "crate-path=target/package/fini-${CARGO_VERSION}.crate" >> "$GITHUB_OUTPUT"

      # Validates the publish path (manifest, registry metadata, build from
      # the packaged tarball). Note: as of the current toolchain, a dry-run
      # abort leaves the packaged .crate in target/package/tmp-crate/ instead
      # of finalizing it at target/package/fini-<version>.crate (regression
      # found releasing v0.4.0, 2026-07-12) — so the explicit `cargo package`
      # step below is required to guarantee the file the hash/attest steps
      # expect actually exists at that path.
      - name: cargo publish --dry-run
        run: cargo publish --locked --dry-run

      # Explicit packaging step: guarantees target/package/fini-<version>.crate
      # exists at a stable path regardless of cargo's dry-run-abort behavior.
      - name: cargo package
        run: cargo package --locked

      - name: Record pre-publish hash
        id: hash
        env:
          CRATE: ${{ steps.prepare.outputs.crate-path }}
        run: |
          set -euo pipefail
          BEFORE=$(sha256sum "$CRATE" | awk '{print $1}')
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Pre-publish $CRATE sha256: $BEFORE"

      - name: Attest .crate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.crate-path }}

      - name: Publish to crates.io
        env:
          # Token must be scoped to `publish-update` only (fini is already
          # published, so `publish-new` is unnecessary).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked --no-verify

      - name: Verify post-publish .crate hash unchanged
        # If this fails, the crate is already on crates.io. The attestation
        # may not cover the uploaded bytes — yank the version via
        # `cargo yank --version <v>` and investigate before re-releasing.
        env:
          BEFORE: ${{ steps.hash.outputs.before }}
          CRATE: ${{ steps.prepare.outputs.crate-path }}
        run: |
          set -euo pipefail
          AFTER=$(sha256sum "$CRATE" | awk '{print $1}')
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::$CRATE sha256 changed between attest and publish ($BEFORE -> $AFTER); attestation may not cover the published artifact. Yank and investigate." >&2
            exit 1
          fi
